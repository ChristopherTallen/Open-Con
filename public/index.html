<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Open Con World - 16-bit Sci-Fi Comic-Con</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #090a0f;
      color: #e0e6ed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    /* CYBER-PIXEL 16-BIT RETRO UI FRAMES */
    .cyber-box {
      background: rgba(14, 17, 26, 0.92);
      border: 3px solid #00f0ff;
      box-shadow: 
        inset 2px 2px 0px rgba(255, 255, 255, 0.2),
        inset -2px -2px 0px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(0, 240, 255, 0.35);
      image-rendering: pixelated;
    }

    .cyber-btn {
      background: #191c2b;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      font-size: 20px;
      padding: 4px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 5px #00f0ff;
      transition: all 0.15s ease;
    }
    .cyber-btn:hover {
      background: #00f0ff;
      color: #090a0f;
      box-shadow: 0 0 10px #00f0ff;
    }
    .cyber-btn:active {
      transform: translateY(2px);
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1100px;
      max-height: 680px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #11131c;
      image-rendering: pixelated;
    }

    /* TOP HUD */
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-interactive { pointer-events: auto; }

    /* RETRACTABLE ROBLOX-STYLE SCI-FI CHAT */
    #chat-panel {
      position: absolute;
      top: 60px;
      left: 12px;
      width: 350px;
      height: 390px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 10px;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    #chat-panel.hidden {
      transform: translateX(-380px);
      opacity: 0;
      pointer-events: none;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: rgba(8, 10, 16, 0.85);
      border: 2px solid #1a233a;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 20px;
    }
    .chat-bubble-row {
      line-height: 1.3;
      word-break: break-word;
    }
    .chat-bubble-row .author {
      font-weight: bold;
      color: #00f0ff;
      cursor: pointer;
      text-shadow: 0 0 4px rgba(0, 240, 255, 0.6);
      margin-right: 4px;
    }

    #chat-bottom-bar {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #formatting-row {
      display: flex;
      gap: 4px;
    }
    .fmt-btn {
      padding: 2px 8px;
      font-size: 16px;
      border-color: #2b3553;
      color: #9aa8c7;
    }
    #chat-input-row {
      display: flex;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      padding: 4px 10px;
      font-size: 19px;
      border: 2px solid #00f0ff;
      background: #0d101a;
      color: #fff;
      outline: none;
    }
    #chat-input:focus {
      box-shadow: 0 0 8px #00f0ff;
    }
    #file-input { display: none; }

    /* CYBER JOYSTICK FOR MOBILE/TABLETS */
    #joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 120px;
      height: 120px;
      background: rgba(0, 240, 255, 0.08);
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 50%;
      z-index: 15;
      display: none;
      touch-action: none;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: #00f0ff;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 12px #00f0ff;
      pointer-events: none;
    }

    /* SCI-FI USER PROFILE CARD (TAP/CLICK) */
    #profile-modal {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 12, 0.85);
      backdrop-filter: blur(4px);
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .cyber-profile-card {
      width: 330px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar-frame {
      width: 76px;
      height: 76px;
      border: 3px solid #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      background: #000;
      overflow: hidden;
    }
    .profile-avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
    .roles-box {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .role-tag {
      font-size: 16px;
      background: rgba(0, 240, 255, 0.12);
      color: #00f0ff;
      padding: 2px 8px;
      border: 1px solid #00f0ff;
    }

    /* LOGIN SCREEN */
    #auth-overlay {
      position: absolute;
      inset: 0;
      background: #090a0f;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 20px;
    }
    #auth-overlay h1 {
      font-size: 46px;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="600"></canvas>

  <!-- Top Bar -->
  <div id="top-bar">
    <div style="display:flex; gap:8px;">
      <button class="cyber-btn hud-interactive" onclick="toggleChat()">💬 Comm Link</button>
      <div class="cyber-box hud-interactive" id="zone-display" style="padding:4px 12px; font-size:20px; color:#00f0ff;">
        Main Lobby (#main-chat)
      </div>
    </div>
    <div class="cyber-btn hud-interactive" id="user-badge" onclick="showSelfProfile()">Scanning...</div>
  </div>

  <!-- Retractable Sci-Fi Chat Panel -->
  <div class="cyber-box" id="chat-panel">
    <div id="chat-messages">
      <div class="chat-bubble-row"><i>⚡ Open Con Neural Net connected. Tap any hero to inspect.</i></div>
    </div>
    <div id="chat-bottom-bar">
      <div id="formatting-row">
        <button class="cyber-btn fmt-btn" onclick="addFormat('**', '**')">B</button>
        <button class="cyber-btn fmt-btn" onclick="addFormat('*', '*')">I</button>
        <button class="cyber-btn fmt-btn" onclick="addFormat('__', '__')">U</button>
        <button class="cyber-btn fmt-btn" onclick="insertEmoji('⚡')">⚡</button>
        <button class="cyber-btn fmt-btn" onclick="insertEmoji('🦸')">🦸</button>
        <button class="cyber-btn fmt-btn" onclick="insertEmoji('🔥')">🔥</button>
      </div>
      <form id="chat-form" onsubmit="handleChatSubmit(event)">
        <div id="chat-input-row">
          <button type="button" class="cyber-btn fmt-btn" onclick="document.getElementById('file-input').click()">📎</button>
          <input type="file" id="file-input" accept="image/*" />
          <input type="text" id="chat-input" placeholder="Transmit to Discord (Silent)..." autocomplete="off" />
        </div>
      </form>
    </div>
  </div>

  <!-- Mobile Touch Virtual Joystick -->
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <!-- Sci-Fi Profile Inspection Modal -->
  <div id="profile-modal" onclick="closeProfile()">
    <div class="cyber-box cyber-profile-card" onclick="event.stopPropagation()">
      <div class="profile-avatar-frame">
        <img id="p-avatar" src="" alt="avatar" />
      </div>
      <h2 id="p-displayName" style="font-size:28px; color:#00f0ff; text-shadow:0 0 6px #00f0ff;">DisplayName</h2>
      <p id="p-username" style="font-size:18px; color:#7888a6;">@username</p>
      <div class="roles-box" id="p-roles"></div>
      <a href="#" target="_blank" class="cyber-btn" id="p-dm-btn" style="text-decoration:none; margin-top:10px;">Transmit Discord DM</a>
    </div>
  </div>

  <!-- OAuth Login Screen -->
  <div id="auth-overlay">
    <h1>⚡ OPEN CON: 16-BIT EXPO ⚡</h1>
    <p style="font-size:22px; color:#8d9db5;">Initialize link with your Discord credentials:</p>
    <a href="/auth/discord" class="cyber-btn" style="font-size:24px; padding:10px 28px; text-decoration:none; margin-top:8px;">
      ⚡ Authorize with Discord ⚡
    </a>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // Paste your Discord Channel IDs here:
  const DISCORD_CHANNELS = {
    lobby: '1351966487664918573',
    dc: '1564610495171002399',
    marvel: '1564610737744125972'
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const socket = io();

  let myId = null;
  let currentUser = null;
  let players = {};
  let currentRoom = 'lobby';
  let pendingFile = null;
  const speechBubbles = {};

  // Check URL query parameters for OAuth login payload
  const urlParams = new URLSearchParams(window.location.search);
  const authPayload = urlParams.get('auth');
  if (authPayload) {
    try {
      currentUser = JSON.parse(atob(authPayload));
      localStorage.setItem('opencon_session', JSON.stringify(currentUser));
      window.history.replaceState({}, document.title, "/");
    } catch (e) { console.error('OAuth parse error', e); }
  } else {
    const cached = localStorage.getItem('opencon_session');
    if (cached) currentUser = JSON.parse(cached);
  }

  if (currentUser) {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('user-badge').innerText = `⚡ ${currentUser.displayName}`;
    socket.emit('joinGame', currentUser);
  }

  // Futuristic Expo Booths Layout
  const zones = {
    dc: { x: 50, y: 110, w: 260, h: 440, floor: '#0c1626', neon: '#0077ff', name: 'DC Pavilion (#dc-comics)' },
    lobby: { x: 350, y: 110, w: 260, h: 440, floor: '#131621', neon: '#00f0ff', name: 'Central Arena (#main-chat)' },
    marvel: { x: 650, y: 110, w: 260, h: 440, floor: '#260f14', neon: '#ff2244', name: 'Marvel Pavilion (#marvel-comics)' },
    nemesisLab: { x: 740, y: 20, w: 180, h: 70, floor: '#1d0c26', neon: '#bf00ff', name: 'N.E.M.E.S.I.S. Core' }
  };

  // Keyboard controls (PC / Laptop)
  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (document.activeElement.id === 'chat-input') return;
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  // MOBILE TOUCH / TABLET JOYSTICK CONTROLS
  const joystickZone = document.getElementById('joystick-zone');
  const joystickKnob = document.getElementById('joystick-knob');
  let joystickTouchId = null;
  let joyDelta = { x: 0, y: 0 };

  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    joystickZone.style.display = 'block';
  }

  joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joystickTouchId = touch.identifier;
    handleJoystickMove(touch);
  });

  window.addEventListener('touchmove', (e) => {
    if (joystickTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        handleJoystickMove(e.changedTouches[i]);
        break;
      }
    }
  });

  const resetJoystick = () => {
    joystickTouchId = null;
    joyDelta = { x: 0, y: 0 };
    joystickKnob.style.top = '35px';
    joystickKnob.style.left = '35px';
  };
  window.addEventListener('touchend', resetJoystick);
  window.addEventListener('touchcancel', resetJoystick);

  function handleJoystickMove(touch) {
    const rect = joystickZone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxRadius = 40;

    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    const dist = Math.hypot(dx, dy);

    if (dist > maxRadius) {
      dx = (dx / dist) * maxRadius;
      dy = (dy / dist) * maxRadius;
    }

    joystickKnob.style.left = `${35 + dx}px`;
    joystickKnob.style.top = `${35 + dy}px`;

    joyDelta = { x: dx / maxRadius, y: dy / maxRadius };
  }

  // Toggle Chat Drawer
  function toggleChat() {
    document.getElementById('chat-panel').classList.toggle('hidden');
  }

  function addFormat(prefix, suffix) {
    const input = document.getElementById('chat-input');
    input.value += `${prefix}text${suffix}`;
    input.focus();
  }

  function insertEmoji(em) {
    const input = document.getElementById('chat-input');
    input.value += em;
    input.focus();
  }

  function parseMarkdown(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
      .replace(/\*(.*?)\*/g, '<i>$1</i>')
      .replace(/__(.*?)__/g, '<u>$1</u>');
  }

  // File listener
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      pendingFile = { name: file.name, data: evt.target.result };
      document.getElementById('chat-input').placeholder = `📎 [Attached: ${file.name}] Press Enter!`;
      document.getElementById('chat-input').focus();
    };
    reader.readAsDataURL(file);
  });

  function handleChatSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg && !pendingFile) return;

    const targetChannelId = DISCORD_CHANNELS[currentRoom] || DISCORD_CHANNELS.lobby;
    socket.emit('sendGameChat', {
      channelId: targetChannelId,
      message: msg,
      fileData: pendingFile ? pendingFile.data : null,
      fileName: pendingFile ? pendingFile.name : null
    });

    if (myId && players[myId]) {
      speechBubbles[myId] = { text: msg || '📎 [Image Transmitted]', expiresAt: Date.now() + 5000 };
    }

    pendingFile = null;
    input.value = '';
    input.placeholder = 'Transmit to Discord (Silent)...';
  }

  // Socket Events
  socket.on('connect', () => { myId = socket.id; });
  socket.on('currentPlayers', (srv) => { players = srv; });
  socket.on('newPlayer', (p) => { players[p.id] = p; });
  socket.on('playerMoved', (p) => {
    if (players[p.id]) Object.assign(players[p.id], p);
  });
  socket.on('playerDisconnected', (id) => {
    delete players[id];
    delete speechBubbles[id];
  });

  function appendChatMessage(author, message, isDiscord = false) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'chat-bubble-row';
    div.innerHTML = `<span class="author">${isDiscord ? '⚡ ' : ''}${author}:</span> ${parseMarkdown(message)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  socket.on('discordMessage', (data) => {
    appendChatMessage(data.displayName || data.author, data.content || '[File/Image]', true);
    speechBubbles['discord_' + Date.now()] = {
      text: `${data.displayName}: ${data.content || '[Attachment]'}`,
      x: 480,
      y: 160,
      expiresAt: Date.now() + 6000
    };
  });

  socket.on('gameMessage', (data) => {
    appendChatMessage(data.displayName, data.message);
  });

  // CLICK / TOUCH TO INSPECT USER PROFILE
  function handleCanvasInteraction(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (clientX - rect.left) * scaleX;
    const clickY = (clientY - rect.top) * scaleY;

    for (const id in players) {
      const p = players[id];
      const dist = Math.hypot(p.x - clickX, p.y - clickY);
      if (dist < 35) {
        openProfileModal(p);
        break;
      }
    }
  }

  canvas.addEventListener('click', (e) => handleCanvasInteraction(e.clientX, e.clientY));

  function showSelfProfile() {
    if (currentUser) openProfileModal(currentUser);
  }

  function openProfileModal(userData) {
    document.getElementById('p-displayName').innerText = userData.displayName || 'Hero';
    document.getElementById('p-username').innerText = `@${userData.username || 'unknown'}`;
    document.getElementById('p-avatar').src = userData.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';

    const rolesContainer = document.getElementById('p-roles');
    rolesContainer.innerHTML = '';
    (userData.roles || []).forEach(r => {
      const span = document.createElement('span');
      span.className = 'role-tag';
      span.innerText = `⚡ ${r.name}`;
      rolesContainer.appendChild(span);
    });

    const dmBtn = document.getElementById('p-dm-btn');
    if (userData.discordId || userData.id) {
      dmBtn.href = `https://discord.com/users/${userData.discordId || userData.id}`;
      dmBtn.style.display = 'inline-flex';
    } else {
      dmBtn.style.display = 'none';
    }

    document.getElementById('profile-modal').style.display = 'flex';
  }

  function closeProfile() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  // GAME LOOP & LOGIC
  function update() {
    if (myId && players[myId]) {
      const p = players[myId];
      const speed = 3.8;
      let moved = false;
      let dir = p.direction;

      // Handle keyboard
      if (keys['w'] || keys['arrowup']) { p.y -= speed; dir = 'up'; moved = true; }
      if (keys['s'] || keys['arrowdown']) { p.y += speed; dir = 'down'; moved = true; }
      if (keys['a'] || keys['arrowleft']) { p.x -= speed; dir = 'left'; moved = true; }
      if (keys['d'] || keys['arrowright']) { p.x += speed; dir = 'right'; moved = true; }

      // Handle mobile joystick
      if (Math.abs(joyDelta.x) > 0.15 || Math.abs(joyDelta.y) > 0.15) {
        p.x += joyDelta.x * speed;
        p.y += joyDelta.y * speed;
        moved = true;
        if (Math.abs(joyDelta.x) > Math.abs(joyDelta.y)) {
          dir = joyDelta.x > 0 ? 'right' : 'left';
        } else {
          dir = joyDelta.y > 0 ? 'down' : 'up';
        }
      }

      p.x = Math.max(30, Math.min(canvas.width - 30, p.x));
      p.y = Math.max(40, Math.min(canvas.height - 50, p.y));
      p.direction = dir;
      p.isMoving = moved;

      // Room Detection
      let detectedRoom = 'lobby';
      if (p.x < 320) detectedRoom = 'dc';
      else if (p.x > 640) detectedRoom = 'marvel';

      if (detectedRoom !== currentRoom) {
        currentRoom = detectedRoom;
        document.getElementById('zone-display').innerText = zones[currentRoom].name;
      }

      if (moved) {
        socket.emit('playerMovement', {
          x: p.x,
          y: p.y,
          direction: p.direction,
          isMoving: p.isMoving,
          room: currentRoom
        });
      }
    }
  }

  // DRAW HIGH-TECH CONVENTION FLOOR WITH LED GRID LINES
  function drawSciFiFloor(ctx) {
    const tileSize = 32;
    for (let x = 0; x < canvas.width; x += tileSize) {
      for (let y = 0; y < canvas.height; y += tileSize) {
        ctx.fillStyle = ((x / tileSize + y / tileSize) % 2 === 0) ? '#12141e' : '#161926';
        ctx.fillRect(x, y, tileSize, tileSize);
      }
    }

    // High-tech floor grid borders
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += tileSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += tileSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
  }

  // DRAW 16-BIT RETRO SUPERHERO / SCI-FI CHARACTER
  function drawSciFiCharacter(ctx, x, y, direction, isMoving, displayName) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    const stepBob = isMoving ? Math.sin(Date.now() / 90) * 2 : 0;

    // Cyber shadow
    ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 18, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Dark Tactical Pants & Combat Boots
    ctx.fillStyle = '#161922'; // Stealth pants
    if (isMoving) {
      const legBob = Math.sin(Date.now() / 90) * 5;
      ctx.fillRect(-7, 8, 5, 9 + legBob);
      ctx.fillRect(2, 8, 5, 9 - legBob);
      ctx.fillStyle = '#00f0ff'; // Neon boot accents
      ctx.fillRect(-8, 15 + legBob, 6, 3);
      ctx.fillRect(1, 15 - legBob, 6, 3);
    } else {
      ctx.fillRect(-7, 8, 5, 9);
      ctx.fillRect(2, 8, 5, 9);
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(-8, 15, 6, 3);
      ctx.fillRect(1, 15, 6, 3);
    }

    // Cyber Jacket / Superhero Torso
    ctx.fillStyle = '#212738';
    ctx.fillRect(-9, -4 + stepBob, 18, 13);
    // Glowing Core / Hero Emblem on chest
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(-3, 0 + stepBob, 6, 5);

    // Head / Visage
    ctx.fillStyle = '#ffdfbf'; // Anime/Hero skin tone
    ctx.fillRect(-8, -18 + stepBob, 16, 14);

    // Modern Sci-Fi Hair / Cowl
    ctx.fillStyle = '#2d1b4e'; // Cyber-violet hair
    ctx.fillRect(-9, -23 + stepBob, 18, 8);
    if (direction === 'left') ctx.fillRect(-9, -17 + stepBob, 4, 7);
    if (direction === 'right') ctx.fillRect(5, -17 + stepBob, 4, 7);

    // Eyes / Cyber Visor
    ctx.fillStyle = '#00f0ff'; // Glowing visor optics
    if (direction === 'down') {
      ctx.fillRect(-6, -14 + stepBob, 12, 3);
    } else if (direction === 'left') {
      ctx.fillRect(-7, -14 + stepBob, 5, 3);
    } else if (direction === 'right') {
      ctx.fillRect(2, -14 + stepBob, 5, 3);
    }

    // Futuristic Neon Name Badge
    ctx.font = '18px "VT323", monospace';
    const tagW = ctx.measureText(displayName).width;
    ctx.fillStyle = 'rgba(10, 15, 25, 0.9)';
    ctx.fillRect(-tagW / 2 - 5, -38 + stepBob, tagW + 10, 18);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(-tagW / 2 - 5, -38 + stepBob, tagW + 10, 18);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(displayName, 0, -24 + stepBob);

    ctx.restore();
  }

  // CYBER-PIXEL HOLOGRAPHIC SPEECH BUBBLE
  function drawCyberBubble(ctx, x, y, text) {
    ctx.font = '19px "VT323", monospace';
    const textWidth = ctx.measureText(text).width;
    const padding = 10;
    const boxW = textWidth + padding * 2;
    const boxH = 24;

    ctx.fillStyle = 'rgba(10, 14, 24, 0.95)';
    ctx.fillRect(x - boxW / 2, y - 18, boxW, boxH);
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - boxW / 2, y - 18, boxW, boxH);

    ctx.fillStyle = '#00f0ff';
    ctx.textAlign = 'center';
    ctx.fillText(text, x, y);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Sci-Fi Convention Tile Floor
    drawSciFiFloor(ctx);

    // 2. Neon-Framed Expo Booths
    for (const key in zones) {
      const z = zones[key];
      // Booth Platform
      ctx.fillStyle = z.floor;
      ctx.fillRect(z.x, z.y, z.w, z.h);

      // Glowing Neon Acrylic Border
      ctx.strokeStyle = z.neon;
      ctx.lineWidth = 3;
      ctx.shadowColor = z.neon;
      ctx.shadowBlur = 10;
      ctx.strokeRect(z.x, z.y, z.w, z.h);
      ctx.shadowBlur = 0; // reset glow

      // Holographic Signboard
      ctx.fillStyle = 'rgba(8, 12, 20, 0.85)';
      ctx.fillRect(z.x + 8, z.y + 8, z.w - 16, 28);
      ctx.strokeStyle = z.neon;
      ctx.lineWidth = 2;
      ctx.strokeRect(z.x + 8, z.y + 8, z.w - 16, 28);

      ctx.fillStyle = '#fff';
      ctx.font = '22px "VT323", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(z.name, z.x + z.w / 2, z.y + 29);
    }

    // 3. Draw Players
    const now = Date.now();
    for (const id in players) {
      const p = players[id];
      drawSciFiCharacter(ctx, p.x, p.y, p.direction || 'down', p.isMoving || false, p.displayName || p.username);

      if (speechBubbles[id] && speechBubbles[id].expiresAt > now) {
        drawCyberBubble(ctx, p.x, p.y - 54, speechBubbles[id].text);
      }
    }

    // 4. Draw Floating Discord Broadcast Messages
    for (const key in speechBubbles) {
      const b = speechBubbles[key];
      if (b.expiresAt > now && b.x !== undefined) {
        drawCyberBubble(ctx, b.x, b.y, b.text);
      }
    }

    requestAnimationFrame(() => {
      update();
      draw();
    });
  }

  draw();
</script>
</body>
</html>
